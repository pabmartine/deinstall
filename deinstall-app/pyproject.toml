[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deinstall"
version = "1.0.0"
description = "GTK4/libadwaita app to list and uninstall applications from any source (apt, snap, Flatpak, AppImage)"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"

[project.scripts]
deinstall = "deinstall.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
